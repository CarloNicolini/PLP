name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: uv sync --all-groups
      - name: Run offline tests
        # Both excluded modules import the absent soft_nand_circuit example.
        # The live llm fixture skips without credentials; no secrets are supplied.
        run: >-
          uv run pytest tests/ -q
          --ignore=tests/test_circuit_controller_live.py
          --ignore=tests/test_soft_nand_circuit.py
      - name: Build documentation with warnings as errors
        run: make docs-strict
      - name: Verify public API entries rendered
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import plp

          html = Path("docs/_build/html/api/core.html").read_text(encoding="utf-8")
          missing = [name for name in plp.__all__ if f'id="plp.{name}"' not in html]
          if missing:
              raise SystemExit(f"Missing API documentation: {', '.join(missing)}")
          print(f"Rendered all {len(plp.__all__)} public API entries.")
          PY
      - name: Build and validate distributions
        run: |
          uv run python -m build
          uv run twine check dist/*
      - name: Upload distributions for review
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
