[project]
name = "plp"
version = "0.1.0"
description = "Probabilistic Language Programming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "jinja2>=3.1.6",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.3",
    "openai>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "restrictedpython>=8.1",
    "scipy>=1.17.1",
    "tenacity>=9.1.4",
    "torch>=2.11.0",
    "transformers>=5.3.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
docs = [
    "myst-parser>=5.0.0",
    "pydata-sphinx-theme>=0.17.1",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.10.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
addopts = "--ignore=tests/test_reliability_example.py"
